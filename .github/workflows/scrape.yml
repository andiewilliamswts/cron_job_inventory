name: Monthly Truck Trader Scraper

on:
  schedule:
    # Runs at 01:00 UTC on the 1st of every month
    # This equals 5:00 PM PST (Standard Time) on the last day of the previous month
    - cron: '0 1 1 * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Scraper Script
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python main.py
        
      - name: Commit and Push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add truck_data.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Add monthly scrape data"
          git push
